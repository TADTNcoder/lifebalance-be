name: Backend Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module:
          - discovery-server
          - gateway
          - identity-service
          - task-service
          - timeline-service
          - resource-capital-service
          - finance-service
          - notification-service
          - analytics-service
          - ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable image name
        shell: bash
        run: |
          version="${{ inputs.version || github.ref_name }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "RELEASE_IMAGE=ghcr.io/$owner/lifebalance/${{ matrix.module }}:$version" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lifebalance-backend
          file: lifebalance-backend/docker/spring/Dockerfile
          build-args: MODULE_NAME=${{ matrix.module }}
          load: true
          tags: ${{ env.RELEASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push "$RELEASE_IMAGE"
