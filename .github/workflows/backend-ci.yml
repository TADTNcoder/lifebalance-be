name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "lifebalance-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "lifebalance-backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lifebalance-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify OpenAPI coverage policy
        shell: pwsh
        run: ./scripts/check-openapi-readiness.ps1
      - name: Validate production and staging Compose models
        run: |
          docker compose --env-file .env.example -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.prod.yaml -f compose.staging.yaml --profile monitoring config --quiet
      - name: Run unit and Docker-backed integration tests
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: lifebalance-backend/**/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14
