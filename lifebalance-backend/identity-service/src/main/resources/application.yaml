server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  profiles:
    default: local

  application:
    name: identity-service

  data:
    redis:
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

lifebalance:
  rbac:
    cache:
      type: ${LIFEBALANCE_RBAC_CACHE_TYPE:caffeine}
      ttl: ${LIFEBALANCE_RBAC_CACHE_TTL:15m}
      maximum-size: ${LIFEBALANCE_RBAC_CACHE_MAXIMUM_SIZE:10000}

  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:lifebalance-api}

  keycloak:
    password-change:
      enabled: ${LIFEBALANCE_KEYCLOAK_PASSWORD_CHANGE_ENABLED:false}
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8082}
      realm: ${KEYCLOAK_REALM:lifebalance}
      verifier-client-id: ${KEYCLOAK_PASSWORD_VERIFIER_CLIENT_ID:lifebalance-password-verifier}
      verifier-client-secret: ${KEYCLOAK_PASSWORD_VERIFIER_CLIENT_SECRET:}
      admin-auth-realm: ${KEYCLOAK_PASSWORD_ADMIN_AUTH_REALM:lifebalance}
      admin-client-id: ${KEYCLOAK_PASSWORD_ADMIN_CLIENT_ID:lifebalance-password-admin}
      admin-client-secret: ${KEYCLOAK_PASSWORD_ADMIN_CLIENT_SECRET:}
      maximum-attempts: ${LIFEBALANCE_PASSWORD_CHANGE_MAXIMUM_ATTEMPTS:5}
      attempt-window: ${LIFEBALANCE_PASSWORD_CHANGE_ATTEMPT_WINDOW:15m}
      minimum-length: 12
      maximum-length: 128

    role-sync:
      enabled: ${LIFEBALANCE_KEYCLOAK_ROLE_SYNC_ENABLED:false}
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8082}
      realm: ${KEYCLOAK_REALM:lifebalance}
      auth-realm: ${KEYCLOAK_ADMIN_AUTH_REALM:master}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      username: ${KEYCLOAK_ADMIN_USERNAME:${KEYCLOAK_ADMIN:}}
      password: ${KEYCLOAK_ADMIN_PASSWORD:}

info:
  app:
    name: LifeBalance Identity Service
    version: 1.0.0
    description: Identity, auth, user, and role API

logging:
  level:
    root: INFO
    com.lifebalance.identity: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
