server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  profiles:
    default: local

  application:
    name: timeline-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: timeline
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration/postgresql

management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

lifebalance:
  integration:
    internal-secret: ${LIFEBALANCE_INTERNAL_SERVICE_SECRET:}
  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:lifebalance-api}
  timeline:
    policy:
      conflict-policy: ${TIMELINE_CONFLICT_POLICY:REJECT}

info:
  app:
    name: LifeBalance Timeline Service
    version: 1.0.0
    description: Timeline API

logging:
  level:
    root: INFO
    com.lifebalance.timeline: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
