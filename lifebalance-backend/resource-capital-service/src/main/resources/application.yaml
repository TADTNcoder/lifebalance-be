server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  profiles:
    default: local

  application:
    name: resource-capital-service

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: resourcecapital
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

lifebalance:
  integration:
    enabled: ${LIFEBALANCE_INTEGRATION_ENABLED:true}
    task-service:
      base-url: ${TASK_SERVICE_BASE_URL:http://task-service:8080}
    notification-service:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://notification-service:8080}
      enabled: ${NOTIFICATION_SERVICE_INTEGRATION_ENABLED:true}
      policy-approved: ${NOTIFICATION_SERVICE_POLICY_APPROVED:false}

  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:lifebalance-api}

info:
  app:
    name: LifeBalance Resource Capital Service
    version: 1.0.0
    description: Resource capital cycle and allocation foundation API

logging:
  level:
    root: INFO
    com.lifebalance.resourcecapital: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
