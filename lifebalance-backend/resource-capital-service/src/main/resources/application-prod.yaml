server:
  port: ${RESOURCE_CAPITAL_SERVICE_PORT:8098}

lifebalance:
  integration:
    notification-service:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL}

spring:
  flyway:
    # Development-only repeatable seed scripts may already exist in a database
    # promoted from dev/local. They are intentionally not part of production
    # locations, so missing repeatables must not block a production start.
    ignore-migration-patterns: repeatable:missing
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:resource-capital-service}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
