spring:
  datasource:
    url: jdbc:h2:mem:ai_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    locations: classpath:db/migration/h2

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/.well-known/jwks.json

eureka:
  client:
    enabled: false
