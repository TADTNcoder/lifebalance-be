server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  profiles:
    default: local

  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/identity/**,/api/v1/identity/**,/api/auth/**,/auth/**,/api/users/**,/users/**,/api/roles/**,/roles/**,/api/permissions/**,/permissions/**,/api/administration-support/**,/administration-support/**,/api/audit-logs/**,/audit-logs/**

            - id: task-service
              uri: lb://TASK-SERVICE
              predicates:
                - Path=/api/tasks/**,/api/categories/**,/api/tags/**,/tags/**

            - id: resource-capital-service
              uri: lb://RESOURCE-CAPITAL-SERVICE
              predicates:
                - Path=/api/v1/capital/**,/api/v1/capital-cycles/**,/api/v1/capital-adjustments/**,/api/v1/capital-allocations/**

            - id: timeline-service
              uri: lb://TIMELINE-SERVICE
              predicates:
                - Path=/api/timeline/**

            - id: finance-service
              uri: lb://FINANCE-SERVICE
              predicates:
                - Path=/api/finance/**,/api/transactions/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/ai/**

            - id: analytics-service
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/api/analytics/**

management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    gateway:
      enabled: true

    health:
      probes:
        enabled: true

lifebalance:
  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:lifebalance-api}

info:
  app:
    name: LifeBalance Gateway
    version: 1.0.0
    description: Enterprise API Gateway

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
