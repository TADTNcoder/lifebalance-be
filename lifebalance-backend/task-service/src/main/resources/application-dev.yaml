server:
  port: ${TASK_SERVICE_PORT:8092}

lifebalance:
  integration:
    timeline-service:
      base-url: ${TIMELINE_SERVICE_BASE_URL:http://timeline-service:8080}
    notification-service:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://notification-service:8080}
      policy-approved: ${NOTIFICATION_POLICY_APPROVED:false}
    analytics-service:
      base-url: ${ANALYTICS_SERVICE_BASE_URL:http://analytics-service:8080}
      actual-seed-enabled: ${ANALYTICS_ACTUAL_SEED_ENABLED:false}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/lifebalance}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:task-service}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery-server:8080/eureka}

management:
  endpoint:
    health:
      show-details: when_authorized
