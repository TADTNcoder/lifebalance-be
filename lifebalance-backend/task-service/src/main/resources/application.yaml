server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  profiles:
    default: local

  application:
    name: task-service

  jpa:
    open-in-view: false

  flyway:
    locations:
      - classpath:db/migration/postgresql

management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

lifebalance:
  integration:
    enabled: ${LIFEBALANCE_INTEGRATION_ENABLED:true}
    internal-secret: ${LIFEBALANCE_INTERNAL_SERVICE_SECRET:}
    timeline-service:
      enabled: ${TIMELINE_SERVICE_INTEGRATION_ENABLED:true}
      base-url: ${TIMELINE_SERVICE_BASE_URL:http://timeline-service:8080}
    notification-service:
      enabled: ${NOTIFICATION_SERVICE_INTEGRATION_ENABLED:true}
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://notification-service:8080}
      policy-approved: ${NOTIFICATION_POLICY_APPROVED:false}
    analytics-service:
      enabled: ${ANALYTICS_SERVICE_INTEGRATION_ENABLED:true}
      base-url: ${ANALYTICS_SERVICE_BASE_URL:http://analytics-service:8080}
      actual-seed-enabled: ${ANALYTICS_ACTUAL_SEED_ENABLED:false}
      default-currency-code: ${ANALYTICS_DEFAULT_CURRENCY_CODE:VND}
    finance-service:
      enabled: ${FINANCE_SERVICE_INTEGRATION_ENABLED:true}
      base-url: ${FINANCE_SERVICE_BASE_URL:http://finance-service:8080}

  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:lifebalance-api}

info:
  app:
    name: LifeBalance Task Service
    version: 1.0.0
    description: Task and task group API

logging:
  level:
    root: INFO
    com.lifebalance.task: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"

