server:
  port: ${TASK_SERVICE_PORT:8092}

lifebalance:
  integration:
    timeline-service:
      base-url: ${TIMELINE_SERVICE_BASE_URL:http://localhost:8096}
    notification-service:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8094}
      policy-approved: ${NOTIFICATION_POLICY_APPROVED:false}
    analytics-service:
      base-url: ${ANALYTICS_SERVICE_BASE_URL:http://localhost:8097}
      actual-seed-enabled: ${ANALYTICS_ACTUAL_SEED_ENABLED:false}
    finance-service:
      base-url: ${FINANCE_SERVICE_BASE_URL:http://localhost:8093}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/lifebalance}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
