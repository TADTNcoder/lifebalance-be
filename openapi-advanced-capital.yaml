openapi: 3.0.3
info:
  title: LifeBalance Advanced Capital API
  version: 1.0.0
  description: >
    OpenAPI contract for LB-845 Advanced Capital. This specification covers
    capital adjustments, allocations, reallocations, releases, history queries,
    and capital summary/reporting endpoints.
  contact:
    name: LifeBalance Team
    email: team@lifebalance.com
  license:
    name: LifeBalance
    url: https://lifebalance.com/license
servers:
  - url: /
    description: Current service or gateway host
security:
  - bearerAuth: []
tags:
  - name: Advanced Capital Adjustments
    description: Create and query capital adjustment records.
  - name: Advanced Capital Allocations
    description: Allocate, reallocate, release, and report capital assigned to targets.
  - name: Advanced Capital History
    description: Query capital movement histories and summary reports.
paths:
  /api/v1/capital-cycles/{cycleId}/time-capital/adjustments:
    post:
      tags:
        - Advanced Capital Adjustments
      summary: Create time capital adjustment
      description: Create an INCREASE, DECREASE, or OVERRIDE adjustment for planned time capital in a mutable capital cycle.
      operationId: createTimeCapitalAdjustment
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustTimeCapitalRequest'
            example:
              adjustmentType: INCREASE
              amountInMinutes: 120
              reason: Added two hours for late sprint planning.
      responses:
        '201':
          description: Time capital adjustment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTimeCapitalAdjustment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/money-capital/adjustments:
    post:
      tags:
        - Advanced Capital Adjustments
      summary: Create money capital adjustment
      description: Create an INCREASE, DECREASE, or OVERRIDE adjustment for planned money capital in a mutable capital cycle.
      operationId: createMoneyCapitalAdjustment
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustMoneyCapitalRequest'
            example:
              adjustmentType: DECREASE
              amount: 500000.0000
              reason: Reduced optional discretionary budget.
      responses:
        '201':
          description: Money capital adjustment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMoneyCapitalAdjustment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/adjustments:
    get:
      tags:
        - Advanced Capital Adjustments
      summary: List capital adjustments
      description: List adjustment records for a capital cycle with optional capital type filtering.
      operationId: listCapitalAdjustments
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/CapitalKindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Capital adjustments returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalAdjustmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/allocations:
    post:
      tags:
        - Advanced Capital Allocations
      summary: Allocate capital
      description: Allocate time or money capital to a target such as a task or category.
      operationId: allocateCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateCapitalRequest'
            example:
              capitalType: TIME
              targetType: TASK
              targetId: 77777777-7777-7777-7777-777777777777
              amount: 120.0000
              allowOverAllocation: false
              reason: Reserve focus time for sprint planning task.
      responses:
        '201':
          description: Capital allocated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAllocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/reallocations:
    post:
      tags:
        - Advanced Capital Allocations
      summary: Reallocate capital
      description: Move allocated capital from one target to another target in the same cycle and capital type.
      operationId: reallocateCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReallocateCapitalRequest'
            example:
              capitalType: TIME
              sourceTargetType: TASK
              sourceTargetId: 77777777-7777-7777-7777-777777777777
              destinationTargetType: TASK
              destinationTargetId: 88888888-8888-8888-8888-888888888888
              amount: 60.0000
              reason: Move focus time to implementation task.
      responses:
        '200':
          description: Capital reallocated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAllocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/releases:
    post:
      tags:
        - Advanced Capital Allocations
      summary: Release capital
      description: Release allocated capital from a target back to the cycle pool.
      operationId: releaseCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCapitalRequest'
            example:
              capitalType: TIME
              targetType: TASK
              targetId: 77777777-7777-7777-7777-777777777777
              amount: 30.0000
              reason: Task scope reduced.
      responses:
        '200':
          description: Capital released successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAllocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/allocation-breakdown:
    get:
      tags:
        - Advanced Capital Allocations
      summary: Get allocation breakdown
      description: Get allocation breakdown grouped by target for a capital cycle.
      operationId: getAllocationBreakdown
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/AllocationTargetTypeQuery'
      responses:
        '200':
          description: Allocation breakdown returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseResourceBreakdownList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/histories:
    get:
      tags:
        - Advanced Capital History
      summary: Get cycle capital histories
      description: Get paginated capital movement history for a single cycle.
      operationId: getCapitalCycleHistories
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/CapitalKindQuery'
        - $ref: '#/components/parameters/CapitalActionTypeQuery'
        - $ref: '#/components/parameters/ReferenceTypeQuery'
        - $ref: '#/components/parameters/ReferenceIdQuery'
        - $ref: '#/components/parameters/FromDateTimeQuery'
        - $ref: '#/components/parameters/ToDateTimeQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Cycle capital histories returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital/history:
    get:
      tags:
        - Advanced Capital History
      summary: Get aggregate capital history
      description: Get paginated capital movement history across the authenticated user's capital cycles.
      operationId: getAggregateCapitalHistory
      parameters:
        - name: capitalCycleId
          in: query
          required: false
          description: Filter by capital cycle id.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-2222-2222-222222222222
        - $ref: '#/components/parameters/CapitalKindQuery'
        - $ref: '#/components/parameters/FromDateTimeQuery'
        - $ref: '#/components/parameters/ToDateTimeQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Aggregate capital history returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital/summary:
    get:
      tags:
        - Advanced Capital History
      summary: Get active capital summary
      description: Get time and money capital summary for the authenticated user's active cycle.
      operationId: getAdvancedCapitalSummary
      responses:
        '200':
          description: Active capital summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/available-capital:
    get:
      tags:
        - Advanced Capital History
      summary: Get available capital
      description: Get available capital after current allocations, optionally filtered by capital type.
      operationId: getAdvancedAvailableCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/CapitalKindTypeQuery'
      responses:
        '200':
          description: Available capital returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAvailableCapital'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/remaining-capital:
    get:
      tags:
        - Advanced Capital History
      summary: Get remaining capital
      description: Get planned, allocated, remaining, and over-allocation state, optionally filtered by capital type.
      operationId: getAdvancedRemainingCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/CapitalKindTypeQuery'
      responses:
        '200':
          description: Remaining capital returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRemainingCapital'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token using the Bearer authentication scheme.
  parameters:
    CycleIdPath:
      name: cycleId
      in: path
      required: true
      description: Capital cycle id.
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222
    CapitalKindQuery:
      name: capitalType
      in: query
      required: false
      description: Filter by capital kind.
      schema:
        $ref: '#/components/schemas/CapitalKind'
      example: TIME
    CapitalKindTypeQuery:
      name: type
      in: query
      required: false
      description: Return a single capital kind when provided.
      schema:
        $ref: '#/components/schemas/CapitalKind'
      example: MONEY
    AllocationTargetTypeQuery:
      name: targetType
      in: query
      required: true
      description: Allocation target type. Current persistence migration enforces TASK; CATEGORY is reserved for category-level allocation enablement.
      schema:
        $ref: '#/components/schemas/AllocationTargetType'
      example: TASK
    CapitalActionTypeQuery:
      name: actionType
      in: query
      required: false
      description: Filter by capital history action type.
      schema:
        $ref: '#/components/schemas/CapitalActionType'
      example: ALLOCATE
    ReferenceTypeQuery:
      name: referenceType
      in: query
      required: false
      description: Filter by movement reference type.
      schema:
        $ref: '#/components/schemas/CapitalReferenceType'
      example: TASK
    ReferenceIdQuery:
      name: referenceId
      in: query
      required: false
      description: Filter by movement reference id.
      schema:
        type: string
        format: uuid
      example: 77777777-7777-7777-7777-777777777777
    FromDateTimeQuery:
      name: fromDate
      in: query
      required: false
      description: Inclusive lower bound for createdAt.
      schema:
        type: string
        format: date-time
      example: '2026-08-01T00:00:00Z'
    ToDateTimeQuery:
      name: toDate
      in: query
      required: false
      description: Exclusive upper bound for createdAt.
      schema:
        type: string
        format: date-time
      example: '2026-09-01T00:00:00Z'
    PageQuery:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      example: 0
    SizeQuery:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
      example: 20
    SortQuery:
      name: sort
      in: query
      required: false
      description: Sort expression in Spring Pageable format.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
        - createdAt,desc
        - id,desc
  responses:
    BadRequest:
      description: Bad Request or validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: COMMON_VALIDATION_FAILED
              message: Request validation failed
              details:
                amount: must be greater than zero
            timestamp: '2026-08-14T00:00:00Z'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: AUTH_UNAUTHORIZED
              message: Authentication is required
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    Forbidden:
      description: Authenticated user does not have permission to access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: AUTH_FORBIDDEN
              message: Access is denied
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: COMMON_NOT_FOUND
              message: Resource was not found
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    Conflict:
      description: Business conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: CAPITAL_CONFLICT
              message: Capital operation conflicts with current allocation state
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: COMMON_INTERNAL_ERROR
              message: Unexpected server error
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
  schemas:
    ApiResponseBase:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          format: date-time
          example: '2026-08-14T00:00:00Z'
    ApiResponseError:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - success
            - error
            - timestamp
          properties:
            success:
              type: boolean
              example: false
            data:
              type: object
              nullable: true
              description: Always null for failed responses.
            error:
              $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: COMMON_VALIDATION_FAILED
        message:
          type: string
          example: Request validation failed
        details:
          type: object
          additionalProperties:
            type: string
          example:
            amount: must be greater than zero
    ApiResponseTimeCapitalAdjustment:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseTimeCapitalAdjustmentData'
    ApiResponseTimeCapitalAdjustmentData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/TimeCapitalAdjustmentResponse'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseMoneyCapitalAdjustment:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseMoneyCapitalAdjustmentData'
    ApiResponseMoneyCapitalAdjustmentData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MoneyCapitalAdjustmentResponse'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseCapitalAdjustmentPage:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseCapitalAdjustmentPageData'
    ApiResponseCapitalAdjustmentPageData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PageCapitalAdjustment'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseAllocation:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseAllocationData'
    ApiResponseAllocationData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AllocationResponse'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseResourceBreakdownList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseResourceBreakdownListData'
    ApiResponseResourceBreakdownListData:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBreakdown'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseCapitalHistoryPage:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseCapitalHistoryPageData'
    ApiResponseCapitalHistoryPageData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PageCapitalHistory'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseCapitalSummary:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseCapitalSummaryData'
    ApiResponseCapitalSummaryData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CapitalSummaryResponse'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseAvailableCapital:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseAvailableCapitalData'
    ApiResponseAvailableCapitalData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AvailableCapitalResponse'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiResponseRemainingCapital:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - $ref: '#/components/schemas/ApiResponseRemainingCapitalData'
    ApiResponseRemainingCapitalData:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/RemainingCapitalResponse'
        error:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    AdjustTimeCapitalRequest:
      type: object
      required:
        - adjustmentType
        - amountInMinutes
        - reason
      properties:
        adjustmentType:
          $ref: '#/components/schemas/CapitalAdjustmentType'
        amountInMinutes:
          type: integer
          format: int64
          minimum: 1
