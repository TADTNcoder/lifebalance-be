components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token using the Bearer authentication scheme.
  parameters:
    CapitalCycleIdPath:
      name: id
      in: path
      required: true
      description: Capital cycle id.
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222
    CycleIdPath:
      name: cycleId
      in: path
      required: true
      description: Capital cycle id.
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222
    TaskIdPath:
      name: id
      in: path
      required: true
      description: Task id.
      schema:
        type: string
        format: uuid
      example: 77777777-7777-7777-7777-777777777777
    CategoryIdPath:
      name: id
      in: path
      required: true
      description: Category id.
      schema:
        type: string
        format: uuid
      example: 55555555-5555-5555-5555-555555555555
    TagIdPath:
      name: id
      in: path
      required: true
      description: Tag id.
      schema:
        type: string
        format: uuid
      example: 66666666-6666-6666-6666-666666666666
    CapitalKindQuery:
      name: type
      in: query
      required: false
      description: Return a single capital kind when provided.
      schema:
        $ref: '#/components/schemas/CapitalKind'
      example: TIME
    CapitalCycleTypeQuery:
      name: type
      in: query
      required: false
      description: Filter by capital cycle type.
      schema:
        $ref: '#/components/schemas/CapitalCycleType'
      example: MONTHLY
    CapitalCycleStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by capital cycle status.
      schema:
        $ref: '#/components/schemas/CapitalCycleStatus'
      example: ACTIVE
    PageQuery:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      example: 0
    SizeQuery:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
      example: 20
    SortQuery:
      name: sort
      in: query
      required: false
      description: Sort expression in Spring Pageable format, for example createdAt,desc.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
        - createdAt,desc
        - id,desc
  responses:
    BadRequest:
      description: Bad Request or validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: COMMON_VALIDATION_FAILED
              message: Request validation failed
              details:
                name: must not be blank
            timestamp: '2026-08-14T00:00:00Z'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: AUTH_UNAUTHORIZED
              message: Authentication is required
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    Forbidden:
      description: Authenticated user does not have permission to access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: AUTH_FORBIDDEN
              message: Access is denied
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: COMMON_NOT_FOUND
              message: Resource was not found
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    Conflict:
      description: Business conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: RESOURCE_CONFLICT
              message: Business rule conflict
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
          example:
            success: false
            data: null
            error:
              code: COMMON_INTERNAL_ERROR
              message: Unexpected server error
              details: {}
            timestamp: '2026-08-14T00:00:00Z'
  schemas:
    ApiResponseBase:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          format: date-time
          example: '2026-08-14T00:00:00Z'
    ApiResponseError:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - success
            - error
            - timestamp
          properties:
            success:
              type: boolean
              example: false
            data:
              type: object
              nullable: true
              description: Always null for failed responses.
            error:
              $ref: '#/components/schemas/ApiError'
    ApiResponseVoid:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - success
            - timestamp
          properties:
            data:
              type: object
              nullable: true
              description: Null for void success responses.
            error:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiResponseCapitalCycle:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CapitalCycleResponse'
            error:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiResponseCapitalCyclePage:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PageCapitalCycleResponse'
            error:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiResponseTimeCapital:
