openapi: 3.0.3
info:
  title: LifeBalance Sprint 3 Resource Capital and Task Core API
  version: 1.0.0
  description: >
    OpenAPI contract for LB-828 covering Sprint 3 Resource Capital Foundation
    and Task Core endpoints. All documented responses use the LifeBalance
    ApiResponse envelope: success, data, error, and timestamp.
  contact:
    name: LifeBalance Team
    email: team@lifebalance.com
  license:
    name: LifeBalance
    url: https://lifebalance.com/license
servers:
  - url: /
    description: Current service or gateway host
security:
  - bearerAuth: []
tags:
  - name: Capital Cycles
    description: Capital cycle lifecycle, activation, closure, reopening, and listing APIs.
  - name: Time Capital
    description: Time capital setup and adjustment APIs.
  - name: Money Capital
    description: Money capital setup and adjustment APIs.
  - name: Capital Resources
    description: Available and remaining capital resource APIs.
  - name: Capital
    description: Capital history and summary APIs.
  - name: Tasks
    description: Task core CRUD and lifecycle APIs.
  - name: Categories
    description: Task category management APIs.
  - name: Tags
    description: User-owned task tag management APIs.
paths:
  /api/v1/capital-cycles:
    get:
      tags:
        - Capital Cycles
      summary: List capital cycles
      description: List authenticated user's capital cycles with optional type, status, period, pagination, and sorting filters.
      operationId: listCapitalCycles
      parameters:
        - $ref: '#/components/parameters/CapitalCycleTypeQuery'
        - $ref: '#/components/parameters/CapitalCycleStatusQuery'
        - name: fromDate
          in: query
          required: false
          description: Include cycles ending on or after this date.
          schema:
            type: string
            format: date
          example: '2026-08-01'
        - name: toDate
          in: query
          required: false
          description: Include cycles starting before or on this date.
          schema:
            type: string
            format: date
          example: '2026-08-31'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Capital cycles returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCyclePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Capital Cycles
      summary: Create capital cycle
      description: Create a new user-owned capital cycle in DRAFT status after validating period rules and overlap constraints.
      operationId: createCapitalCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCapitalCycleRequest'
            example:
              name: August 2026 monthly cycle
              description: Main planning cycle for August 2026.
              type: MONTHLY
              startDate: '2026-08-01'
              endDate: '2026-08-31'
      responses:
        '201':
          description: Capital cycle created successfully.
          headers:
            Location:
              description: URL of the created capital cycle.
              schema:
                type: string
              example: /api/v1/capital-cycles/22222222-2222-2222-2222-222222222222
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/active:
    get:
      tags:
        - Capital Cycles
      summary: Get active capital cycle
      description: Get the authenticated user's active capital cycle, optionally filtered by cycle type.
      operationId: getActiveCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleTypeQuery'
      responses:
        '200':
          description: Active capital cycle returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{id}:
    get:
      tags:
        - Capital Cycles
      summary: Get capital cycle
      description: Get an authenticated user's capital cycle detail by id.
      operationId: getCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleIdPath'
      responses:
        '200':
          description: Capital cycle returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Capital Cycles
      summary: Update capital cycle
      description: Update editable information for an authenticated user's DRAFT capital cycle.
      operationId: updateCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCapitalCycleRequest'
            example:
              name: August 2026 focus cycle
              description: Updated planning scope for August 2026.
              type: MONTHLY
              startDate: '2026-08-01'
              endDate: '2026-08-31'
      responses:
        '200':
          description: Capital cycle updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Capital Cycles
      summary: Delete capital cycle
      description: Delete an authenticated user's DRAFT capital cycle only when no dependent capital records exist.
      operationId: deleteCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleIdPath'
      responses:
        '204':
          description: Capital cycle deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{id}/activate:
    post:
      tags:
        - Capital Cycles
      summary: Activate capital cycle
      description: Activate a DRAFT or REOPENED capital cycle after ownership, status transition, and one-active-cycle validation.
      operationId: activateCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleIdPath'
      responses:
        '200':
          description: Capital cycle activated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{id}/close:
    post:
      tags:
        - Capital Cycles
      summary: Close capital cycle
      description: Close an ACTIVE or REOPENED capital cycle with a required business reason.
      operationId: closeCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCapitalCycleRequest'
            example:
              reason: Monthly cycle completed.
      responses:
        '200':
          description: Capital cycle closed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{id}/reopen:
    post:
      tags:
        - Capital Cycles
      summary: Reopen capital cycle
      description: Reopen a CLOSED capital cycle with a required business reason.
      operationId: reopenCapitalCycle
      parameters:
        - $ref: '#/components/parameters/CapitalCycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenCapitalCycleRequest'
            example:
              reason: Need correction after late transaction import.
      responses:
        '200':
          description: Capital cycle reopened successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalCycle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/time-capital:
    post:
      tags:
        - Time Capital
      summary: Setup time capital
      description: Initialize planned time capital for an editable capital cycle.
      operationId: setupTimeCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupTimeCapitalRequest'
            example:
              plannedMinutes: 9600
      responses:
        '201':
          description: Time capital initialized successfully.
          headers:
            Location:
              description: URL of the initialized time capital resource.
              schema:
                type: string
              example: /api/v1/capital-cycles/22222222-2222-2222-2222-222222222222/time-capital
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTimeCapital'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/time-capital/adjustments:
    post:
      tags:
        - Time Capital
      summary: Adjust time capital
      description: Increase, decrease, or override planned time capital for an adjustable capital cycle.
      operationId: adjustTimeCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustTimeCapitalRequest'
            example:
              adjustmentType: INCREASE
              amountInMinutes: 120
              reason: Added two hours for late sprint planning.
      responses:
        '200':
          description: Time capital adjusted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTimeCapitalAdjustment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/money-capital:
    post:
      tags:
        - Money Capital
      summary: Setup money capital
      description: Initialize planned money capital and currency for an editable capital cycle.
      operationId: setupMoneyCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupMoneyCapitalRequest'
            example:
              plannedAmount: 15000000.0000
              currencyCode: VND
      responses:
        '201':
          description: Money capital initialized successfully.
          headers:
            Location:
              description: URL of the initialized money capital resource.
              schema:
                type: string
              example: /api/v1/capital-cycles/22222222-2222-2222-2222-222222222222/money-capital
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMoneyCapital'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/money-capital/adjustments:
    post:
      tags:
        - Money Capital
      summary: Adjust money capital
      description: Increase, decrease, or override planned money capital for an adjustable capital cycle.
      operationId: adjustMoneyCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustMoneyCapitalRequest'
            example:
              adjustmentType: DECREASE
              amount: 500000.0000
              reason: Reduced optional discretionary budget.
      responses:
        '200':
          description: Money capital adjusted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMoneyCapitalAdjustment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/available-capital:
    get:
      tags:
        - Capital Resources
      summary: Get available capital
      description: Get available time and money capital after current allocations. Use type to return a single capital resource.
      operationId: getAvailableCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/CapitalKindQuery'
      responses:
        '200':
          description: Available capital returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAvailableCapital'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital-cycles/{cycleId}/remaining-capital:
    get:
      tags:
        - Capital Resources
      summary: Get remaining capital
      description: Get remaining time and money capital including planned, allocated, remaining, and over-allocation state.
      operationId: getRemainingCapital
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
        - $ref: '#/components/parameters/CapitalKindQuery'
      responses:
        '200':
          description: Remaining capital returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRemainingCapital'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital/history:
    get:
      tags:
        - Capital
      summary: Get capital history
      description: Get paginated capital movement history for the authenticated user.
      operationId: getCapitalHistory
      parameters:
        - name: capitalCycleId
          in: query
          required: false
          description: Filter by capital cycle id.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-2222-2222-222222222222
        - name: capitalType
          in: query
          required: false
          description: Filter by capital kind.
          schema:
            $ref: '#/components/schemas/CapitalKind'
          example: TIME
        - name: fromDate
          in: query
          required: false
          description: Inclusive lower bound for history createdAt.
          schema:
            type: string
            format: date-time
          example: '2026-08-01T00:00:00Z'
        - name: toDate
          in: query
          required: false
          description: Exclusive upper bound for history createdAt.
          schema:
            type: string
            format: date-time
          example: '2026-09-01T00:00:00Z'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Capital history returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/capital/summary:
    get:
      tags:
        - Capital
      summary: Get capital summary
      description: Get summary totals for the authenticated user's current active capital cycle.
      operationId: getCapitalSummary
      responses:
        '200':
          description: Capital summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCapitalSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: Search tasks
      description: Search tasks by keyword with pagination and sorting.
      operationId: searchTasks
      parameters:
        - name: keyword
          in: query
          required: false
          description: Case-insensitive keyword matched against task name.
          schema:
            type: string
            default: ''
          example: planning
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/SortQuery'
      responses:
        '200':
          description: Tasks returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Tasks
      summary: Create task
      description: Create a new task in DRAFT status.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              name: Prepare sprint planning
              description: Review capacity and scope for Sprint 3.
              priority: HIGH
              deadline: '2026-08-20'
              estimatedMinutes: 120
              estimatedCost: 0
              categoryId: 55555555-5555-5555-5555-555555555555
      responses:
        '200':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task by id
      description: Get a single task by id.
      operationId: getTaskById
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: Task returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Tasks
      summary: Update task
      description: Update task details, progress, and status.
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              name: Prepare sprint planning
              description: Finalize scope and update task estimates.
              priority: HIGH
              deadline: '2026-08-20'
              progress: 50
              estimatedMinutes: 150
              estimatedCost: 0
              categoryId: 55555555-5555-5555-5555-555555555555
              status: IN_PROGRESS
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Tasks
      summary: Delete task
      description: Delete a task by id.
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: Task deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tasks/{id}/duplicate:
    post:
      tags:
        - Tasks
      summary: Duplicate task
      description: Duplicate an existing task as a new DRAFT task.
