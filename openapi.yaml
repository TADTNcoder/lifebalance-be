              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiResponseCategoryList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CategoryResponse'
            error:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiResponseTag:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TagResponse'
            error:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiResponseTagList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TagResponse'
            error:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: COMMON_VALIDATION_FAILED
        message:
          type: string
          example: Request validation failed
        details:
          type: object
          additionalProperties:
            type: string
          example:
            name: must not be blank
    CreateCapitalCycleRequest:
      type: object
      required:
        - name
        - type
        - startDate
        - endDate
      properties:
        name:
          type: string
          maxLength: 255
          example: August 2026 monthly cycle
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: Main planning cycle for August 2026.
        type:
          $ref: '#/components/schemas/CapitalCycleType'
        startDate:
          type: string
          format: date
          example: '2026-08-01'
        endDate:
          type: string
          format: date
          example: '2026-08-31'
    UpdateCapitalCycleRequest:
      allOf:
        - $ref: '#/components/schemas/CreateCapitalCycleRequest'
      description: Same payload as create. startDate must not be after endDate, and updates are allowed only for DRAFT cycles.
    CloseCapitalCycleRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 1000
          example: Monthly cycle completed.
    ReopenCapitalCycleRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 1000
          example: Need correction after late transaction import.
    SetupTimeCapitalRequest:
      type: object
      required:
        - plannedMinutes
      properties:
        plannedMinutes:
          type: integer
          format: int64
          minimum: 0
          example: 9600
    SetupMoneyCapitalRequest:
      type: object
      required:
        - plannedAmount
        - currencyCode
      properties:
        plannedAmount:
          type: number
          format: decimal
          minimum: 0
          multipleOf: 0.0001
          example: 15000000.0000
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
          example: VND
    AdjustTimeCapitalRequest:
      type: object
      required:
        - adjustmentType
        - amountInMinutes
        - reason
      properties:
        adjustmentType:
          $ref: '#/components/schemas/CapitalAdjustmentType'
